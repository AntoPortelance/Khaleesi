name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Run tests when available
        shell: bash
        run: |
          if [ -d tests ]; then
            # Install application dependencies once this manifest exists.
            if [ -f requirements.txt ]; then
              python -m pip install -r requirements.txt
            fi
            python -m pytest tests
          else
            echo "No test suite yet; application behavior has not been validated."
          fi

  web-format:
    name: Web formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes prettier@3.6.2 --check '**/*.{js,mjs,cjs,jsx,ts,tsx,css,scss,html,json}' --no-error-on-unmatched-pattern
